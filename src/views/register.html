  <script>
    /* ===================== CONFIG ===================== */

const LIFF_ID = "__LIFF_ID__";
const API_URL = "/api";
const SUBMIT_LABEL = `
  <i class="fa-solid fa-circle-check"></i>
  <span>บันทึกข้อมูลการลงทะเบียน</span>`;

let idToken = "";
let currentUserId = "";
let submitting = false;
let bootstrapMode = false;
let cachedManagers = [];

/* ===================== DOM ===================== */

const $ = (id) => document.getElementById(id);

const loadingOverlay = $("loadingOverlay");
const loadingText = $("loadingText");
const loadingTime = $("loadingTime");
const registerForm = $("registerForm");
const userPicture = $("userPicture");
const userNameDisplay = $("userNameDisplay");
const userIdDisplay = $("userIdDisplay");
const lineUserIdInput = $("lineUserId");
const companySelect = $("company");
const employeeIdInput = $("employeeId");

// รหัสพนักงาน: ตัวเลขเท่านั้น (แปลงเลขไทย ๐-๙ เป็นเลขอารบิก แล้วตัดอักขระอื่นทิ้ง)
employeeIdInput.addEventListener("input", function () {
  this.value = this.value
    .replace(/[๐-๙]/g, function (d) { return "๐๑๒๓๔๕๖๗๘๙".indexOf(d); })
    .replace(/[^0-9]/g, "");
});

const titleSelect = $("title");
const fullNameInput = $("fullName");
const divisionInput = $("division");
const departmentInput = $("department");
const positionInput = $("position");
const managerSelect = $("managerLineId");
const refreshMgrBtn = $("refreshMgrBtn");
const submitBtn = $("submitBtn");

/* ===================== UTIL ===================== */

function escapeHtml(v) {
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setLoading(text) {
  loadingText.textContent = text || "กำลังโหลด...";
}

function hideLoading() {
  loadingOverlay.classList.add("hidden");
}

/* ===================== API (ผ่าน Cloudflare Worker /api) ===================== */

async function callApi(fn, args = [], timeout = 20000) {
  const started = performance.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    console.log("[API START]", fn);

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fn: fn, args: args }),
      cache: "no-store",
      signal: controller.signal
    });

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("ระบบตอบกลับไม่ใช่ JSON (HTTP " + response.status + ")");
    }

    console.log("[API END]", fn, Math.round(performance.now() - started) + " ms");

    if (!response.ok || !data.ok) {
      throw new Error(data && data.error ? data.error : "HTTP " + response.status);
    }

    return data.result;

  } catch (error) {
    console.error("[API ERROR]", fn, error);

    if (error.name === "AbortError") {
      throw new Error(fn + " ใช้เวลานานเกิน " + timeout / 1000 + " วินาที");
    }
    throw error;

  } finally {
    clearTimeout(timer);
  }
}

/* ===================== LIFF DIAGNOSTIC ===================== */

function liffDiag() {
  const d = {
    sdkLoaded: typeof liff !== "undefined",
    liffId: LIFF_ID,
    href: window.location.href.slice(0, 200),
    ua: navigator.userAgent.slice(0, 120)
  };

  if (typeof liff !== "undefined") {
    try { d.inClient = liff.isInClient(); } catch (e) {}
    try { d.os = liff.getOS(); } catch (e) {}
    try { d.loggedIn = liff.isLoggedIn(); } catch (e) {}
  }

  return d;
}

function showLiffProblem(title, detail, login = false) {
  loadingOverlay.classList.remove("hidden");
  const cleanRedirectUri = window.location.origin + window.location.pathname;

  loadingOverlay.innerHTML = `
    <div class="text-red-500 text-left">
      <p class="font-semibold text-sm text-center">
        <i class="fa-solid fa-triangle-exclamation"></i>
        ${escapeHtml(title)}
      </p>
      <p class="text-xs text-gray-500 mt-2">${escapeHtml(detail)}</p>
      ${login ? `
        <div class="text-center mt-3">
          <button type="button" onclick="try { sessionStorage.removeItem('line-leave:reauth-retry:' + LIFF_ID); sessionStorage.removeItem('line-leave:login-attempt:' + LIFF_ID); } catch(e){}; window.LeaveSystemAuth?.beginLogin(LIFF_ID); try { liff.logout(); } catch(e){}; liff.login({ redirectUri: '${cleanRedirectUri}' });"
                  class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-semibold shadow">
            <i class="fa-solid fa-arrow-rotate-right mr-1"></i> เข้าสู่ระบบ LINE ใหม่อีกครั้ง
          </button>
        </div>` : ""}
      <pre class="text-[10px] text-gray-400 mt-3 whitespace-pre-wrap break-all bg-gray-50 p-2 rounded">${escapeHtml(JSON.stringify(liffDiag(), null, 2))}</pre>
    </div>`;
}

function retryLiffLogin(cleanRedirectUri) {
  const retryKey = "line-leave:reauth-retry:" + LIFF_ID;
  let retryCount = 0;
  try {
    retryCount = Number(sessionStorage.getItem(retryKey) || 0);
  } catch (e) {}
  if (retryCount >= 1) {
    showLiffProblem("เซสชันหมดอายุ", "ไม่สามารถยืนยันตัวตนกับ LINE ได้ กรุณาเข้าสู่ระบบใหม่อีกครั้ง", true);
    return;
  }
  try { sessionStorage.setItem(retryKey, String(retryCount + 1)); } catch (e) {}
  window.LeaveSystemAuth?.beginLogin(LIFF_ID);
  try { liff.logout(); } catch (e) {}
  liff.login({ redirectUri: cleanRedirectUri });
}

/* ===================== INIT LIFF ===================== */

async function initializeLiff() {
  const started = performance.now();
  const cleanRedirectUri = window.location.origin + window.location.pathname;

  try {
    setLoading("กำลังเชื่อมต่อ LINE LIFF...");

    if (typeof liff === "undefined") {
      showLiffProblem("โหลด LIFF SDK ไม่สำเร็จ", "ไม่สามารถโหลด LINE LIFF SDK ได้");
      return;
    }

    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(
        () => reject(new Error("การเชื่อมต่อ LINE LIFF ใช้เวลานานเกินไป (เกิน 15 วินาที)")),
        15000
      )
    );

    window.LeaveSystemAuth?.prepareSession(LIFF_ID);
    await Promise.race([liff.init({ liffId: LIFF_ID }), timeoutPromise]);

    if (window.LeaveSystemAuth?.shouldBlock(LIFF_ID)) {
      if (liff.isLoggedIn()) liff.logout();
      showLiffProblem("ออกจากระบบแล้ว", "กรุณาเข้าสู่ระบบ LINE อีกครั้งเพื่อดำเนินการต่อ", true);
      return;
    }

    // Clean URL query params if returning from LINE Login (removes ?code=...&state=...)
    const returnedFromOAuth = Boolean(
      window.location.search &&
      (window.location.search.includes("code=") || window.location.search.includes("state="))
    );
    if (returnedFromOAuth) {
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (e) {}
    }

    console.log("[LIFF INIT]", Math.round(performance.now() - started), "ms");

    // Show nav bar on PC after LIFF is initialized
    try {
      if (!liff.isInClient()) {
        var nav = document.getElementById("navBar");
        if (nav) nav.classList.remove("hidden");
      }
    } catch (e) {}

    if (!liff.isLoggedIn()) {
      if (returnedFromOAuth) {
        retryLiffLogin(cleanRedirectUri);
        return;
      }
      const loginAttemptKey = "line-leave:login-attempt:" + LIFF_ID;
      let attempts = 0;
      try { attempts = Number(sessionStorage.getItem(loginAttemptKey) || 0); } catch (e) {}
      if (attempts >= 2) {
        showLiffProblem("ไม่สามารถเข้าสู่ระบบ LINE ได้", "กรุณากดปุ่มด้านล่างเพื่อเข้าสู่ระบบใหม่อีกครั้ง", true);
        return;
      }
      try { sessionStorage.setItem(loginAttemptKey, String(attempts + 1)); } catch (e) {}
      // Auto login on PC / external browser
      window.LeaveSystemAuth?.beginLogin(LIFF_ID);
      liff.login({ redirectUri: cleanRedirectUri });
      return;
    }
    try { sessionStorage.removeItem("line-leave:login-attempt:" + LIFF_ID); } catch (e) {}

    idToken = liff.getIDToken() || "";

    // In external browsers (PC), tokens expire after 1 hour.
    // If idToken is missing or expired, force refresh by logging in again.
    let isExpired = !idToken;
    try {
      const decoded = (typeof liff.getDecodedIDToken === "function") ? liff.getDecodedIDToken() : null;
      if (decoded && decoded.exp && (Date.now() >= (decoded.exp * 1000 - 30000))) {
        isExpired = true;
      }
    } catch (e) {
      isExpired = true;
    }

    if (isExpired && !liff.isInClient()) {
      console.warn("User ID token expired or missing on PC, refreshing session...");
      retryLiffLogin(cleanRedirectUri);
      return;
    }

    setLoading("กำลังอ่านข้อมูลบัญชี LINE...");

    let profile;
    try {
      profile = await liff.getProfile();
    } catch (profErr) {
      console.warn("Could not getProfile (session possibly stale), resetting...", profErr);
      retryLiffLogin(cleanRedirectUri);
      return;
    }

    if (window.LeaveSystemAuth && !window.LeaveSystemAuth.completeLogin(LIFF_ID, profile.userId)) {
      window.LeaveSystemAuth.logout();
      showLiffProblem("บัญชี LINE เปลี่ยนไป", "กรุณาเข้าสู่ระบบด้วยบัญชีที่ต้องการใช้งานอีกครั้ง", true);
      return;
    }

    currentUserId = profile.userId;
    lineUserIdInput.value = profile.userId;
    userNameDisplay.textContent = profile.displayName || "LINE User";
    userIdDisplay.textContent = "ID: " + profile.userId;

    if (profile.pictureUrl) userPicture.src = profile.pictureUrl;

    console.log("[PROFILE]", Math.round(performance.now() - started), "ms");

    setLoading("กำลังโหลดข้อมูลพนักงานและรายชื่อหัวหน้า...");

    try {
      await loadPageData();
      try { sessionStorage.removeItem("line-leave:reauth-retry:" + LIFF_ID); } catch (e) {}
    } catch (pageErr) {
      if (pageErr.message && (pageErr.message.includes("LINE authentication required") || pageErr.message.includes("401"))) {
        console.warn("ID Token expired or invalid on backend, re-authenticating...", pageErr);
        retryLiffLogin(cleanRedirectUri);
        return;
      }
      throw pageErr;
    }

    loadingTime.textContent =
      "โหลดเสร็จใน " + Math.round(performance.now() - started) + " ms";

  } catch (error) {
    console.error("LIFF ERROR", error);
    showLiffProblem("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE LIFF", error.message, true);
  }
}

/* ===================== LOAD PAGE DATA ===================== */

async function loadPageData() {
  // Profile และรายชื่อหัวหน้ามาจาก request เดียว พร้อม verify ID Token ครั้งเดียว
  const pageData = await callApi("getRegisterPageData", [currentUserId, idToken]);

  const profile = pageData && pageData.profile;
  const managers = pageData && Array.isArray(pageData.managers) ? pageData.managers : [];
  bootstrapMode = !!(pageData && pageData.bootstrapMode);
  cachedManagers = managers;

  // เติมข้อมูลเดิม
  if (profile && profile.isRegistered) {
    if (profile.company) companySelect.value = profile.company;
    employeeIdInput.value = String(profile.employeeId || "").replace(/[^0-9]/g, "");
    if (profile.title) titleSelect.value = profile.title;
    fullNameInput.value = profile.fullName || "";
    divisionInput.value = profile.division || "";
    updateDepartmentOptions(profile.department || "");
    positionInput.value = profile.approvalRole || (profile.position === "Manager" ? "MANAGER" : profile.position ? "EMPLOYEE" : "");

    managerSelect.setAttribute(
      "data-saved-manager",
      profile.managerLineId || "TOP_MANAGEMENT"
    );
  }

  if (!departmentInput.value) updateDepartmentOptions("");
  renderManagers(managers);

  hideLoading();
  registerForm.classList.remove("hidden");
}

function updateDepartmentOptions(selectedValue) {
  const optionsByDivision = {
    Support: ["HR", "บัญชี", "กฎหมาย", "ธุรการกฎหมาย", "IT"],
    Operate: ["ระบบติดตามหนี้"],
    Management: ["ผู้จัดการทั่วไป"]
  };
  const departments = optionsByDivision[divisionInput.value] || [];
  const managerOption = Array.from(positionInput.options).find(option => option.value === "MANAGER");
  if (managerOption) {
    managerOption.textContent = divisionInput.value === "Support" ? "หัวหน้าแผนก"
      : divisionInput.value === "Management" ? "ผู้จัดการทั่วไป" : "Manager";
  }
  departmentInput.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "เลือกแผนก/ทีม";
  placeholder.disabled = true;
  placeholder.selected = !selectedValue;
  departmentInput.appendChild(placeholder);
  departments.forEach(function (name) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    departmentInput.appendChild(option);
  });
  if (departments.includes(selectedValue)) departmentInput.value = selectedValue;
}

/* ===================== RENDER MANAGER ===================== */

function filterEligibleManagers(managers) {
  const isGeneralManager = function (manager) {
    return manager.division === "Management" && manager.department === "ผู้จัดการทั่วไป";
  };
  return (managers || []).filter(function (manager) {
    if (!manager || manager.approvalRole !== "MANAGER") return false;
    if (positionInput.value === "MANAGER") return isGeneralManager(manager);
    if (divisionInput.value === "Operate") {
      return manager.division === "Operate" && manager.company === companySelect.value;
    }
    if (divisionInput.value === "Support") {
      if (departmentInput.value === "IT") {
        return isGeneralManager(manager) || (manager.division === "Operate" && manager.company === companySelect.value);
      }
      return manager.division === "Support" && manager.department === departmentInput.value;
    }
    return false;
  });
}

function renderManagers(managers) {
  const savedManager = managerSelect.getAttribute("data-saved-manager");

  managerSelect.innerHTML = "";

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "-- กรุณาเลือกหัวหน้าผู้อนุมัติ --";
  defaultOption.disabled = true;
  defaultOption.selected = !savedManager;
  managerSelect.appendChild(defaultOption);

  const mayBootstrapWithoutManager = bootstrapMode && positionInput.value === "MANAGER";
  managerSelect.required = true;
  if (mayBootstrapWithoutManager) {
    const topOption = document.createElement("option");
    topOption.value = "TOP_MANAGEMENT";
    topOption.textContent = "ไม่มีหัวหน้า (ชั่วคราวระหว่างตั้งค่าระบบ)";
    topOption.selected = savedManager === "TOP_MANAGEMENT";
    managerSelect.appendChild(topOption);
  }

  const eligibleManagers = filterEligibleManagers(managers);
  if (Array.isArray(eligibleManagers)) {
    eligibleManagers.forEach(function (mgr) {
      if (!mgr || !mgr.lineUserId || mgr.lineUserId === currentUserId) return;

      const option = document.createElement("option");
      option.value = mgr.lineUserId;

      const position = mgr.position ? " (" + mgr.position + ")" : "";

      option.textContent =
        (mgr.fullName || "-") + position + " - " + (mgr.department || "ไม่ระบุแผนก");

      if (savedManager && savedManager === mgr.lineUserId) {
        option.selected = true;
        defaultOption.selected = false;
      }

      managerSelect.appendChild(option);
    });
  }

  if (savedManager === "TOP_MANAGEMENT" && mayBootstrapWithoutManager) {
    const topOption = Array.from(managerSelect.options).find(option => option.value === "TOP_MANAGEMENT");
    if (topOption) { topOption.selected = true; defaultOption.selected = false; }
  }
}

divisionInput.addEventListener("change", function () { updateDepartmentOptions(""); renderManagers(cachedManagers); });
departmentInput.addEventListener("change", function () { renderManagers(cachedManagers); });
positionInput.addEventListener("change", function () { renderManagers(cachedManagers); });
companySelect.addEventListener("change", function () { renderManagers(cachedManagers); });

/* ===================== REFRESH MANAGER ===================== */

refreshMgrBtn.addEventListener("click", async function () {
  if (refreshMgrBtn.disabled) return;

  refreshMgrBtn.disabled = true;
  refreshMgrBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> กำลังโหลด...`;

  try {
    const pageData = await callApi("getRegisterPageData", [currentUserId, idToken], 20000);
    const managers = pageData && Array.isArray(pageData.managers) ? pageData.managers : [];
    bootstrapMode = !!(pageData && pageData.bootstrapMode);
    cachedManagers = managers;

    renderManagers(managers);

    Swal.fire({
      toast: true,
      position: "top-end",
      icon: "success",
      title: "อัปเดตรายชื่อแล้ว",
      showConfirmButton: false,
      timer: 1200
    });

  } catch (error) {
    console.error("REFRESH MANAGER ERROR", error);
    Swal.fire("ไม่สามารถโหลดรายชื่อได้", error.message, "error");

  } finally {
    refreshMgrBtn.disabled = false;
    refreshMgrBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> รีเฟรชรายชื่อ`;
  }
});

/* ===================== SUBMIT REGISTER ===================== */

registerForm.addEventListener("submit", async function (e) {
  e.preventDefault();

  if (submitting) return;

  const lineUserId = lineUserIdInput.value;
  const company = companySelect.value;
  const employeeId = employeeIdInput.value.trim();
  const title = titleSelect.value;
  const fullName = fullNameInput.value.trim();
  const division = divisionInput.value.trim();
  const department = departmentInput.value.trim();
  const position = positionInput.value.trim();
  let managerLineId = managerSelect.value;

  if (!/^[0-9]+$/.test(employeeId)) {
    Swal.fire("รหัสพนักงานไม่ถูกต้อง", "กรุณากรอกรหัสพนักงานเป็นตัวเลขเท่านั้น", "warning");
    employeeIdInput.focus();
    return;
  }

  if (!lineUserId) {
    Swal.fire("แจ้งเตือน", "ไม่พบ LINE User ID กรุณาเข้าใช้งานผ่าน LINE", "warning");
    return;
  }

  if (!company || !employeeId || !title || !fullName || !division || !department || !position || !managerLineId) {
    Swal.fire(
      "กรุณากรอกข้อมูลให้ครบถ้วน",
      "โปรดระบุ บริษัท, รหัสพนักงาน, คำนำหน้า, ชื่อ-สกุล, ฝ่าย, แผนก, ตำแหน่ง และหัวหน้าผู้อนุมัติ",
      "warning"
    );
    return;
  }

  if (managerLineId === "TOP_MANAGEMENT") managerLineId = "";

  const payload = {
    lineUserId: lineUserId,
    company: company,
    employeeId: employeeId,
    title: title,
    fullName: fullName,
    division: division,
    department: department,
    position: position,
    managerLineId: managerLineId,
    approvalRole: positionInput.value,
    idToken: idToken
  };

  const confirm = await Swal.fire({
    title: "ยืนยันข้อมูลลงทะเบียน?",
    html: `
      <div class="text-left text-xs bg-gray-50 p-3 rounded-lg space-y-1">
        <p><strong>บริษัท:</strong> ${escapeHtml(company)}</p>
        <p><strong>รหัสพนักงาน:</strong> ${escapeHtml(employeeId)}</p>
        <p><strong>ชื่อ-สกุล:</strong> ${escapeHtml(title)} ${escapeHtml(fullName)}</p>
        <p><strong>ฝ่าย:</strong> ${escapeHtml(division)}</p>
        <p><strong>แผนก:</strong> ${escapeHtml(department)}</p>
        <p><strong>ตำแหน่ง:</strong> ${escapeHtml(position)}</p>
      </div>`,
    icon: "question",
    showCancelButton: true,
    confirmButtonColor: "#2563EB",
    confirmButtonText: "บันทึก",
    cancelButtonText: "ยกเลิก"
  });

  if (!confirm.isConfirmed) return;

  await executeRegister(payload);
});

/* ===================== REGISTER API ===================== */

async function executeRegister(payload) {
  submitting = true;
  submitBtn.disabled = true;
  submitBtn.innerHTML = `
    <i class="fa-solid fa-spinner animate-spin"></i>
    <span>กำลังบันทึกข้อมูล...</span>`;

  try {
    const result = await callApi("registerEmployee", [payload], 30000);
    handleSuccess(result);
  } catch (error) {
    handleError(error);
  }
}

function resetSubmitButton() {
  submitting = false;
  submitBtn.disabled = false;
  submitBtn.innerHTML = SUBMIT_LABEL;
}

function handleSuccess(res) {
  if (res && res.success) {

    submitBtn.innerHTML = `
      <i class="fa-solid fa-circle-check"></i>
      <span>บันทึกเรียบร้อยแล้ว</span>`;

    Swal.fire({
      icon: "success",
      title: "สำเร็จ!",
      text: res.message || "บันทึกข้อมูลพนักงานเรียบร้อยแล้ว",
      confirmButtonColor: "#2563EB",
      confirmButtonText: "ตกลง",
      timer: 2000,
      timerProgressBar: true
    }).then(function () {
      try {
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          window.location.href = "/";
        }
      } catch (e) {}
    });

  } else {
    resetSubmitButton();

    Swal.fire(
      "ไม่สำเร็จ",
      res && res.message ? res.message : "เกิดข้อผิดพลาดในการบันทึก",
      "error"
    );
  }
}

function handleError(error) {
  resetSubmitButton();
  console.error("REGISTER ERROR", error);

  Swal.fire(
    "เกิดข้อผิดพลาด",
    error && error.message ? error.message : "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้",
    "error"
  );
}

/* ===================== START ===================== */

window.addEventListener("DOMContentLoaded", initializeLiff);

/* ===================== NAV BAR (PC) ===================== */

(function setupNavBar() {
  try {
    var nav = document.getElementById("navBar");
    var btn = document.getElementById("logoutBtn");
    if (!nav || !btn) return;

    // Show nav bar only on external browser (PC)
    function showNavIfPC() {
      try {
        if (typeof liff !== "undefined" && typeof liff.isInClient === "function" && !liff.isInClient()) {
          nav.classList.remove("hidden");
        }
      } catch (e) {}
    }

    showNavIfPC();
    window.addEventListener("load", function() { setTimeout(showNavIfPC, 500); });

    btn.addEventListener("click", function () {
      window.LeaveSystemAuth?.logout();
      window.location.assign("/");
    });
  } catch (e) {}
})();
  </script>
